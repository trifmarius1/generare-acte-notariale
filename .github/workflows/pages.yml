name: Publică pagina

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Codul
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependențe
        run: npm ci
      - name: Construire
        run: npm run build
        env:
          PAGES_BASE: /generare-acte-notariale/
      - name: Adrese directe
        run: cp dist/index.html dist/404.html
      - name: Pachet
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicare
        id: deployment
        uses: actions/deploy-pages@v4
